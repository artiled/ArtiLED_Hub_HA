set_color:
  name: Set colour
  description: >-
    Set colour on a room, zone or light, optionally on SOME CHANNELS only.
    Home Assistant's light.turn_on has no channel concept, so this is the only
    way to drive one channel of a multi-channel ArtiLED light.
  fields:
    hub:
      name: Hub
      description: >-
        Which Hub, by name or ident. Only needed when more than one Hub is
        configured - with one, it is used automatically.
      required: false
      example: "Main Hub"
      selector: { text: }
    room:
      name: Room
      description: >-
        Room ID. Give EXACTLY ONE of room, zone or light - naming two silently
        coloured only one of them. IDs only here, not names (run_scene and
        run_mode do take names; the Hub resolves those itself).
      example: 15
      selector:
        number: { mode: box, min: 1 }
    zone:
      name: Zone
      description: Zone ID. Give exactly one of room, zone or light.
      example: 16
      selector:
        number: { mode: box, min: 1 }
    light:
      name: Light
      description: Light ID. Give exactly one of room, zone or light.
      example: 52
      selector:
        number: { mode: box, min: 1 }
    channel:
      name: Channel
      description: >-
        The Hub's digit-concat selector, NOT a count: "0" is the whole light,
        "2" is channel 2 only, "13" is channels 1 and 3. All four channels is
        "0" as well (the API reads 1234 as a number over 255).
      default: "0"
      example: "13"
      selector: { text: }
    rgbw:
      name: RGBW
      description: Four values 0-255, red green blue white.
      example: "[255, 0, 0, 0]"
      selector: { object: }
    temperature:
      name: White temperature
      description: The Hub's white channel, 0-255 with 0 the coldest.
      example: 128
      selector: { number: { min: 0, max: 255 } }
    intensity:
      name: White intensity
      description: The Hub's white intensity, 0-255. Defaults to 255.
      example: 255
      selector: { number: { min: 0, max: 255 } }

add_voice_scene:
  name: Add a scoped scene to voice
  description: >-
    Give one room or zone plus one Hub scene a spoken name, and create a scene
    entity for it. Only what you add here exists - the Hub offers hundreds of
    room/scene combinations and generating them all would flood Home Assistant
    and the Alexa app.
  fields:
    hub:
      name: Hub
      description: >-
        Which Hub, by name or ident. Only needed when more than one Hub is
        configured.
      required: false
      example: "Main Hub"
      selector: { text: }
    room:
      name: Room
      description: Hub room id. Give either room or zone, not both.
      required: false
      example: 15
      selector:
        number:
          mode: box
          min: 1
    zone:
      name: Zone
      description: Hub zone id. Give either room or zone, not both.
      required: false
      example: 16
      selector:
        number:
          mode: box
          min: 1
    scene:
      name: Scene
      description: Scene name exactly as the Hub offers it for that scope.
      required: true
      example: "Cinema"
      selector:
        text:
    name:
      name: Spoken name
      description: >-
        What you will say. Stored verbatim, so "Cinema" in the Cinema does not
        become "Cinema Cinema".
      required: true
      example: "Living Room Cinema"
      selector:
        text:

