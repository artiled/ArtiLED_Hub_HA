    Give one room or zone plus one Hub mode a spoken name, and create a SWITCH
    for it. A switch rather than a scene because a mode runs until stopped, so
    it needs an off as well as an on.
  fields:
    hub:
      name: Hub
      description: >-
        Which Hub, by name or ident. Only needed when more than one Hub is
        configured.
      required: false
      example: "Main Hub"
      selector: { text: }
    room:
      name: Room
      description: Hub room id. Give either room or zone, not both.
      required: false
      example: 5
      selector:
        number:
          mode: box
          min: 1
    zone:
      name: Zone
      description: Hub zone id. Give either room or zone, not both.
      required: false
      example: 16
      selector:
        number:
          mode: box
          min: 1
    mode:
      name: Mode
      description: Mode name exactly as the Hub offers it for that scope.
      required: true
      example: "Cinema"
      selector:
        text:
    name:
      name: Spoken name
      description: What you will say. Stored verbatim.
      required: true
      example: "Cinema Mode"
      selector:
        text:

